name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  laravel_setup:
    name: "Laravel project setup"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
        php-version:
          - 8.2
          - 8.3
          - 8.4
          - 8.5
        thread-safety:
          - nts
        laravel-version:
          - 12
          - 13
        exclude:
          - php-version: 8.2
            laravel-version: 13
    steps:
      - name: Setup PHP ${{ matrix.php-version }} ${{ matrix.thread-safety }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer, pie
        env:
          phpts: ${{ matrix.thread-safety }}
      - name: Test
        env:
          os: ${{ matrix.os }}
        run: |
          uname -a
          php -v
          sudo pie install thomas-0816/pdo-duckdb-php
          php -m | grep duckdb
          composer create-project laravel/laravel:^${laravel-version} example-app
          cd example-app
          composer require thomas-0816/laravel-duckdb
          php artisan package:discover
          sed -i 's/sqlite/duckdb/g' .env
          sed -i 's/sqlite/duckdb/g' config/database.php
          php artisan migrate
          echo "new User(['name' => 'foo', 'email' => 'foo@bar.invalid', 'password' => Hash::make('secret')])->save();" | php artisan tinker --execute
          echo "User::firstWhere('name', 'foo')->toArray();" | php artisan tinker --execute | grep foo
          echo "DB::connection('duckdb')->query()->from('users')->where('name', 'foo')->get()->toArray();" | php artisan tinker --execute | grep foo
          echo "DB::connection('duckdb')->getPdo()->getAttribute(PDO::ATTR_DRIVER_NAME);" | php artisan tinker --execute | grep duckdb
          echo "DB::connection('duckdb')->selectOne('pragma version');" | php artisan tinker --execute

  clamav:
    name: "Docker: clamAV"
    runs-on: ubuntu-latest
    needs: [laravel_setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build container and run clamAV
        run: |
          ls -lisah
          docker run --rm --entrypoint sh -v $(pwd):/app clamav/clamav:latest /app/clamdscan.sh

  publish:
    name: "Publish: packagist"
    runs-on: ubuntu-latest
    needs: [clamav]
    steps:
      - name: Publish release on Packagist
        env:
          TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -fsSL -X POST -H 'content-type:application/json' -H "Authorization: Bearer thomas-0816:${TOKEN}" \
            "https://packagist.org/api/update-package" -d'{"repository":{"url":"https://packagist.org/packages/thomas-0816/laravel-duckdb"}}'
