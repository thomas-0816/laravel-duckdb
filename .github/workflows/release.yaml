name: Release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  clamav:
    name: "Docker: clamAV"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build container and run clamAV
        run: |
          ls -lisah
          docker run --rm --entrypoint sh -v $(pwd):/app clamav/clamav:latest /app/clamdscan.sh

  publish:
    name: "Publish: packagist"
    runs-on: ubuntu-latest
    needs: [clamav]
    steps:
      - name: Publish release on Packagist
        env:
          TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl -fsSL -X POST -H 'content-type:application/json' -H "Authorization: Bearer thomas-0816:${TOKEN}" \
            "https://packagist.org/api/update-package" -d'{"repository":{"url":"https://packagist.org/packages/thomas-0816/laravel-pdo-duckdb"}}'
